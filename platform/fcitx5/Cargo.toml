[package]
name = "hux-platform-fcitx5"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "虎虚（hux-ime）fcitx5 平台适配：宿主组装与 C ABI 导出（桌面/Android 共用）"

[lib]
# 静态库：由 C++ 薄壳（shell/hux.cpp）链入 addon .so。
name = "hux_platform_fcitx5"
crate-type = ["staticlib"]

[dependencies]
rusty-leveldb = "4.0.1"
hux-cfg = { path = "../../crates/hux-cfg" }
hux-core = { path = "../../crates/hux-core" }
hux-ffi = { path = "../../crates/hux-ffi" }
hux-scheme-tiger = { path = "../../crates/hux-scheme/tiger" }

# 数据目录**根**规则按目标平台选一份落点实现（见 src/paths.rs）。Cargo 不允许同一个依赖名
# 在不同 target 下指向不同路径，故两份各用本名，共用层只按平台选 `use`（两行 cfg + 兜底报错）。
[target.'cfg(target_os = "android")'.dependencies]
hux-platform-android = { path = "../android" }

[target.'cfg(target_os = "linux")'.dependencies]
hux-platform-linux = { path = "../linux" }

[dev-dependencies]
hux-test-support = { path = "../../crates/hux-test-support" }

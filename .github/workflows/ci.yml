name: ci

on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test kernel & test-support
        run: cargo test -p hux-core -p hux-test-support
      - name: Test schemes
        run: cargo test -p hux-scheme-tiger
      - name: Test cfg / ffi / platform
        run: cargo test -p hux-cfg -p hux-ffi -p hux-platform-fcitx5
      - name: Core platform-clean (no env/XDG/clock/logging)
        run: |
          if grep -RnE 'std::env::var|SystemTime|/usr/share|eprintln!|println!' crates/hux-core/src; then
            echo "::error::hux-core 不得包含平台痕迹（环境变量 / XDG / 系统时钟 / 直接打印）"
            exit 1
          fi
      - name: Core is scheme-free (no hux-scheme dependency)
        run: |
          # 依赖边判定（源码里的文档提及不算）：cargo tree 不得出现 hux-scheme/*
          if cargo tree -p hux-core --edges normal | grep -q 'hux-scheme'; then
            echo "::error::hux-core 不得依赖任何方案（hux-scheme/*，见 docs/refactor.md §1）"
            exit 1
          fi
          # 方案依赖不得反向：方案只允许依赖 hux-core
          if cargo tree -p hux-scheme-tiger --edges normal --depth 1 | grep -qE 'hux-platform|hux-cfg|hux-ffi'; then
            echo "::error::hux-scheme/* 只允许依赖 hux-core"
            exit 1
          fi
          # 平台只经契约驱动方案：除装配处（`scheme::{TigerScheme, ASSETS, SCHEME_ID}`）外
          # 不得引用方案内部模块（见 docs/refactor.md §1/§7）。
          if grep -RnE 'hux_scheme_tiger::(interaction|decode|lexicon|lexical|ngram|char_to_sound_shape|sound_to_char_shape)' platform/fcitx5/src; then
            echo "::error::平台层不得直接引用方案内部模块，请经 hux_core::scheme 契约"
            exit 1
          fi
          if grep -RnE 'crate::(decode|lexicon|lexical|ngram|interaction|sound_to_char_shape|char_to_sound_shape)\b' crates/hux-core/src; then
            echo "::error::hux-core 内不得出现已迁出的方案模块引用"
            exit 1
          fi
      - name: Verify lexical prior data (provenance)
        run: |
          echo "8dbc884b6cb719d07e4cef153c8048db19a11f8224f75a4ed87853e688a27393  data/tiger_sentence.lexical.bin" | sha256sum -c -
      - name: Verify pinyin index data (provenance)
        run: |
          echo "18a0931a323ad58e1b13e610ec93183297118033d571ae303678613a217dad2a  data/tiger_sentence.pinyin.bin.gz" | sha256sum -c -
      - name: Verify pinyin index fixture (regenerate)
        run: |
          python3 tools/generators/gen_pinyin_index.py \
            --source goldens/sound_to_char_shape/PY_c.dict.yaml --out /tmp/pinyin.bin
          cmp /tmp/pinyin.bin goldens/sound_to_char_shape/tiger_sentence.pinyin.bin

  # C++ 侧（fcitx5 addon）：configure → 构建/链接 → C ABI 符号一致 → 安装布局（DESTDIR，免 sudo）。
  # 结构性迁移（如拆 crate / 挪目录）与 ABI 契约漂移（crates/hux-ffi/include/hux_abi.h）在此暴露。
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fcitx5 core dev files
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev
      - name: Configure & build addon (cargo + cmake)
        run: |
          cmake -S platform/fcitx5 -B build/addon \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/addon -j"$(nproc)"
      - name: Verify C ABI symbols (hux_abi.h ↔ libhux.so)
        run: |
          nm -D --defined-only build/addon/libhux.so \
            | awk '$2=="T"||$2=="i"{print $3}' | grep '^hux_' | sort -u > /tmp/so.txt
          grep -oE '\bhux_[a-z_0-9]+[[:space:]]*\(' crates/hux-ffi/include/hux_abi.h \
            | tr -d ' (' | sort -u > /tmp/hdr.txt
          test -s /tmp/hdr.txt && test -s /tmp/so.txt
          if ! diff -u /tmp/hdr.txt /tmp/so.txt; then
            echo "::error::hux_abi.h 声明与 libhux.so 导出不一致（C ABI 漂移）"
            exit 1
          fi
          echo "C ABI 符号一致：$(wc -l < /tmp/so.txt) 个"
      - name: Verify install layout (DESTDIR)
        run: |
          DESTDIR=/tmp/stage cmake --install build/addon
          for f in usr/lib/fcitx5/libhux.so \
                   usr/share/fcitx5/addon/hux.conf \
                   usr/share/fcitx5/inputmethod/hux.conf; do
            test -f "/tmp/stage/$f" || { echo "::error::缺少安装文件 /$f"; exit 1; }
          done

  # 一般金样校验：使用 runner 系统提供的 Lua（Ubuntu 当前可用的最新 lua 包）。
  golden:
    runs-on: ubuntu-latest
    env:
      REFERENCE_REPO: https://github.com/lvyww/tiger-sentense-rime
      REFERENCE_COMMIT: 8b615235c17c858e1eca8f1a41fbc74e202f8bbe
      LIBRIME_RAW: https://raw.githubusercontent.com/rime/librime
      LIBRIME_COMMIT: 33e78140250125871856cdc5b42ddc6a5fcd3cd4
    steps:
      - uses: actions/checkout@v4
      - name: Install system Lua
        run: |
          sudo apt-get update
          package=$(apt-cache search --names-only '^lua[0-9]+\.[0-9]+$' | awk '{print $1}' | sort -V | tail -n 1)
          test -n "$package"
          sudo apt-get install -y "$package"
          sudo ln -sf "$(command -v "$package")" /usr/local/bin/lua
          lua -v
      - name: Fetch reference implementation
        run: |
          git init external/tiger-sentense-rime
          git -C external/tiger-sentense-rime remote add origin "$REFERENCE_REPO"
          git -C external/tiger-sentense-rime fetch --depth 1 origin "$REFERENCE_COMMIT"
          git -C external/tiger-sentense-rime checkout --detach FETCH_HEAD
      - name: Fetch librime key_table.cc (key table provenance)
        run: |
          mkdir -p external/librime/src/rime
          curl -fsSL -o external/librime/src/rime/key_table.cc \
            "$LIBRIME_RAW/$LIBRIME_COMMIT/src/rime/key_table.cc"
          echo "2f7c6a8b4f2aa474d700a87bd4bd1baa48a2655cd6ce4d2ba05b768f284d9d78  external/librime/src/rime/key_table.cc" | sha256sum -c -
      - name: Verify generated key table
        run: |
          python3 tools/generators/gen_key_table.py \
            --source external/librime/src/rime/key_table.cc --out /tmp/key_table.rs
          diff /tmp/key_table.rs crates/hux-core/src/key_table.rs
      - name: Regenerate goldens
        run: |
          lua tools/generators/gen_ngram_golden.lua \
            --reference external/tiger-sentense-rime \
            --model /tmp/ngram_fixture.bin \
            --out /tmp/ngram_fixture.tsv --mode fixture
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/lexicon.tsv --mode present
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data /tmp/no-such-dir --out /tmp/lexicon_missing.tsv --mode missing
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon_variants" --out /tmp/lexicon_variants.tsv --mode present
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon_codes_only" --out /tmp/lexicon_codes_only.tsv --mode present
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode.tsv
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_model.tsv --every 7
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_rank_first.tsv --every 7 --duplicate 0
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode_evidence.tsv --early-commit 1 --required 1
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_evidence_model.tsv --every 7 --early-commit 1 --required 1
          lua tools/generators/gen_learning_golden.lua \
            --reference external/tiger-sentense-rime --out /tmp/learning.tsv
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode_learning.tsv --learning 1
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_learning_model.tsv --every 7 --learning 1
          lua tools/generators/gen_lexical_golden.lua \
            --reference external/tiger-sentense-rime \
            --model "$PWD/data/tiger_sentence.lexical.bin" --out /tmp/lexical.tsv
      - name: Compare with committed goldens
        run: |
          cmp goldens/ngram_fixture.bin /tmp/ngram_fixture.bin
          gunzip -c goldens/ngram_fixture.tsv.gz | cmp - /tmp/ngram_fixture.tsv
          gunzip -c goldens/lexicon.tsv.gz | cmp - /tmp/lexicon.tsv
          gunzip -c goldens/lexicon_missing.tsv.gz | cmp - /tmp/lexicon_missing.tsv
          gunzip -c goldens/lexicon_variants.tsv.gz | cmp - /tmp/lexicon_variants.tsv
          gunzip -c goldens/lexicon_codes_only.tsv.gz | cmp - /tmp/lexicon_codes_only.tsv
          gunzip -c goldens/decode.tsv.gz | cmp - /tmp/decode.tsv
          gunzip -c goldens/decode_model.tsv.gz | cmp - /tmp/decode_model.tsv
          gunzip -c goldens/decode_rank_first.tsv.gz | cmp - /tmp/decode_rank_first.tsv
          gunzip -c goldens/decode_evidence.tsv.gz | cmp - /tmp/decode_evidence.tsv
          gunzip -c goldens/decode_evidence_model.tsv.gz | cmp - /tmp/decode_evidence_model.tsv
          gunzip -c goldens/learning.tsv.gz | cmp - /tmp/learning.tsv
          gunzip -c goldens/decode_learning.tsv.gz | cmp - /tmp/decode_learning.tsv
          gunzip -c goldens/decode_learning_model.tsv.gz | cmp - /tmp/decode_learning_model.tsv
          gunzip -c goldens/lexical.tsv.gz | cmp - /tmp/lexical.tsv

  # Arch 的系统 lua 即最新版；验证金样在最新 Lua 下同样逐字节一致。
  # shell: bash 显式设置（容器内默认 shell 不保证是 bash）。
  golden-lua-latest:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      REFERENCE_REPO: https://github.com/lvyww/tiger-sentense-rime
      REFERENCE_COMMIT: 8b615235c17c858e1eca8f1a41fbc74e202f8bbe
    steps:
      - name: Install toolchain
        run: pacman -Sy --noconfirm git lua gzip diffutils
      - uses: actions/checkout@v4
      - name: Fetch reference implementation
        run: |
          git init external/tiger-sentense-rime
          git -C external/tiger-sentense-rime remote add origin "$REFERENCE_REPO"
          git -C external/tiger-sentense-rime fetch --depth 1 origin "$REFERENCE_COMMIT"
          git -C external/tiger-sentense-rime checkout --detach FETCH_HEAD
      - name: Regenerate goldens (system lua)
        run: |
          lua -v
          lua tools/generators/gen_ngram_golden.lua \
            --reference external/tiger-sentense-rime \
            --model /tmp/ngram_fixture.bin \
            --out /tmp/ngram_fixture.tsv --mode fixture
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/lexicon.tsv --mode present
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data /tmp/no-such-dir --out /tmp/lexicon_missing.tsv --mode missing
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon_variants" --out /tmp/lexicon_variants.tsv --mode present
          lua tools/generators/gen_lexicon_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon_codes_only" --out /tmp/lexicon_codes_only.tsv --mode present
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode.tsv
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_model.tsv --every 7
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_rank_first.tsv --every 7 --duplicate 0
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode_evidence.tsv --early-commit 1 --required 1
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_evidence_model.tsv --every 7 --early-commit 1 --required 1
          lua tools/generators/gen_learning_golden.lua \
            --reference external/tiger-sentense-rime --out /tmp/learning.tsv
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --out /tmp/decode_learning.tsv --learning 1
          lua tools/generators/gen_decode_golden.lua \
            --reference external/tiger-sentense-rime \
            --data "$PWD/goldens/lexicon" --model "$PWD/goldens/ngram_fixture.bin" \
            --lexical "$PWD/data/tiger_sentence.lexical.bin" \
            --out /tmp/decode_learning_model.tsv --every 7 --learning 1
          lua tools/generators/gen_lexical_golden.lua \
            --reference external/tiger-sentense-rime \
            --model "$PWD/data/tiger_sentence.lexical.bin" --out /tmp/lexical.tsv
      - name: Compare with committed goldens
        run: |
          cmp goldens/ngram_fixture.bin /tmp/ngram_fixture.bin
          gunzip -c goldens/ngram_fixture.tsv.gz | cmp - /tmp/ngram_fixture.tsv
          gunzip -c goldens/lexicon.tsv.gz | cmp - /tmp/lexicon.tsv
          gunzip -c goldens/lexicon_missing.tsv.gz | cmp - /tmp/lexicon_missing.tsv
          gunzip -c goldens/lexicon_variants.tsv.gz | cmp - /tmp/lexicon_variants.tsv
          gunzip -c goldens/lexicon_codes_only.tsv.gz | cmp - /tmp/lexicon_codes_only.tsv
          gunzip -c goldens/decode.tsv.gz | cmp - /tmp/decode.tsv
          gunzip -c goldens/decode_model.tsv.gz | cmp - /tmp/decode_model.tsv
          gunzip -c goldens/decode_rank_first.tsv.gz | cmp - /tmp/decode_rank_first.tsv
          gunzip -c goldens/decode_evidence.tsv.gz | cmp - /tmp/decode_evidence.tsv
          gunzip -c goldens/decode_evidence_model.tsv.gz | cmp - /tmp/decode_evidence_model.tsv
          gunzip -c goldens/learning.tsv.gz | cmp - /tmp/learning.tsv
          gunzip -c goldens/decode_learning.tsv.gz | cmp - /tmp/decode_learning.tsv
          gunzip -c goldens/decode_learning_model.tsv.gz | cmp - /tmp/decode_learning_model.tsv
          gunzip -c goldens/lexical.tsv.gz | cmp - /tmp/lexical.tsv

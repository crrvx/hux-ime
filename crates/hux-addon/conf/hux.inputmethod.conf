# 输入法条目 + 引擎设置（项目：hux-ime；方案：虎句 tiger_sentence）
# （安装为 /usr/share/fcitx5/inputmethod/hux.conf；键集见系统 rime.conf/table.conf）
[InputMethod]
Name=hux
Name[en_US]=hux
Name[zh_CN]=hux
Name[zh_TW]=hux
Icon=fcitx-tiger
# 状态栏显示字符
Label=虍
LangCode=zh_CN
Addon=hux
# 图形配置：由 addon 配置 schema 生成（见 hux.addon.conf）
Configurable=True

# 引擎设置（9 项；另有宿主显示项 PanelPreedit）由 addon 的配置 schema 提供（crates/hux-addon/shell/hux.cpp
# 的 `HuxConfig`），默认值在 schema 中声明；用户在 fcitx5-configtool 中修改，
# 保存到 ~/.config/fcitx5/conf/hux.conf，经 C ABI 应用到引擎。
# 运行时选项（<user>/tiger_sentence.options.yaml）优先于此处默认，见 docs/rust-migration.md §5。

# fcitx5 addon 元数据（安装为 /usr/share/fcitx5/addon/hux.conf）
# 键集与系统示例（/usr/share/fcitx5/addon/table.conf 等）一致；
# 引擎设置与输入法条目见 conf/hux.inputmethod.conf。
[Addon]
# 显示名（Name 为回退；[lang] 为本地化）
Name=hux
Name[zh_CN]=hux
Name[zh_TW]=hux
# addon 类别（InputMethod = 输入法引擎）
Category=InputMethod
Version=0.1.0
# 动态库名（不含前缀/后缀；安装为 /usr/lib/fcitx5/libhux.so）
Library=libhux
Type=SharedLibrary
# 按需加载（首次使用输入法时加载）
OnDemand=True
# 图形配置：设置页由本 addon 的配置 schema（C++ `HuxConfig`）在
# fcitx5-configtool 中生成，读写 ~/.config/fcitx5/conf/hux.conf
Configurable=True

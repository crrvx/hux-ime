# fcitx5 addon 元数据（安装为 /usr/share/fcitx5/addon/tigerclaw.conf）
# 键集与系统示例（/usr/share/fcitx5/addon/table.conf 等）一致；
# 引擎设置与输入法条目见 conf/tigerclaw.inputmethod.conf。
[Addon]
# 显示名（Name 为回退；[lang] 为本地化）
Name=Tigerclaw
Name[zh_CN]=虎整句
Name[zh_TW]=虎整句
# addon 类别（InputMethod = 输入法引擎）
Category=InputMethod
Version=0.1.0
# 动态库名（不含前缀/后缀；安装为 /usr/lib/fcitx5/libtigerclaw.so）
Library=libtigerclaw
Type=SharedLibrary
# 按需加载（首次使用输入法时加载）
OnDemand=True
# 图形配置：设置页由本 addon 的配置 schema（C++ `TigerclawConfig`）在
# fcitx5-configtool 中生成，读写 ~/.config/fcitx5/conf/tigerclaw.conf
Configurable=True

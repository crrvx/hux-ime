# 输入法条目 + 引擎设置（项目：虎爪 Tigerclaw；方案：虎整句 tiger_sentence）
# （安装为 /usr/share/fcitx5/inputmethod/tigerclaw.conf；键集见系统 rime.conf/table.conf）
[InputMethod]
Name=Tiger Sentence
Name[en_US]=Tiger Sentence
Name[zh_CN]=虎爪
Name[zh_TW]=虎爪
Icon=fcitx-tiger
# 状态栏显示字符
Label=虎
LangCode=zh_CN
Addon=tigerclaw
# 图形配置：由 addon 配置 schema 生成（见 tigerclaw.addon.conf）
Configurable=True

# 引擎设置（7 项）由 addon 的配置 schema 提供（crates/tigerclaw-addon/shell/tigerclaw.cpp
# 的 `TigerclawConfig`），默认值在 schema 中声明；用户在 fcitx5-configtool 中修改，
# 保存到 ~/.config/fcitx5/conf/tigerclaw.conf，经 C ABI 应用到引擎。
# 运行时选项（<user>/tiger_sentence.options.yaml）优先于此处默认，见 docs/rust-migration.md §5。

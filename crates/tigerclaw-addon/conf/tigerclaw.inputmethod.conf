# 输入法条目 + 虎整句引擎设置
# （安装为 /usr/share/fcitx5/inputmethod/tigerclaw.conf；键集见系统 rime.conf/table.conf）
[InputMethod]
Name=Tiger Sentence
Name[en_US]=Tiger Sentence
Name[zh_CN]=虎整句
Name[zh_TW]=虎整句
Icon=fcitx-tiger
# 状态栏显示字符
Label=虎
LangCode=zh_CN
Addon=tigerclaw
# 无图形配置界面（见文末说明）
Configurable=False

# ── 虎整句引擎设置（参考原生虎码 tiger.conf 的 [Table] 段写法） ──────────────
# 当前 addon 实际读取的配置：
#   * 选项：<user>/tiger_sentence.options.yaml（early_commit / early_commit_to_preedit /
#     allow_duplicate_single；legacy user.yaml 的 var/option/* 只读回退）
#   * 数据：数据目录中的码表四件套、tiger_sentence.lexical.bin、symbols.yaml、可选模型
# 本节为参照 schema 的引擎默认值清单（“更完善”的配置面）——
# 其中 HighFreqLimit/TabLearning/ascii_composer 样式尚待 addon 接线读取，
# 在此之前等价于内建缺省（core 常量 1500 与 option_defaults）。
[TigerSentence]
# 词库/解码：高频字过滤上限（参照 schema tiger_sentence/high_freq_limit）
HighFreqLimit=1500
# 学习：Tab 选字是否写入学习库（参照 schema tiger_sentence/tab_learning）
TabLearning=True
# 早提交（对应选项默认值；亦可在运行时切换）
EarlyCommit=True
EarlyCommitToPreedit=False
AllowDuplicateSingle=True
# 方案开关（运行时可由状态菜单/快捷键切换）
FullShape=False
AsciiPunct=False
# ascii_composer：Shift 轻击切换中/英；CapsLock 跟随系统大小写状态（见 docs/rime-semantics.md）
GoodOldCapsLock=True
CapsLockStyle=clear
ShiftStyle=commit_code
ControlStyle=noop
